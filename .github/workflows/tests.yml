name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The supported range declared in photo_organizer.py
        # (PYTHON_MIN_VERSION) and the README.
        python-version: ["3.12", "3.13", "3.14", "3.15"]

    name: py${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Catches the failure mode that motivated this matrix: syntax that
      # parses on a newer interpreter but not an older one (e.g. 3.14's
      # t-strings or unparenthesized `except A, B:`).
      - name: Byte-compile
        run: python -m compileall -q photo_organizer.py tests/

      - name: Import check
        run: python -c "import photo_organizer; print(photo_organizer.__name__, 'imports OK')"

      - name: CLI smoke test
        run: python photo_organizer.py --help

      - name: Tests
        run: pytest tests/ -q

  version-floor:
    runs-on: ubuntu-latest
    name: vermin (min version)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install vermin
      # Fails if anything raises the floor above 3.12 (the trailing "-" means
      # "must run on 3.12 or older"). Static gate; the matrix job above is the
      # runtime one -- vermin cannot see generics used outside annotations.
      - run: vermin --target=3.12- --no-tips photo_organizer.py tests/

  audit:
    runs-on: ubuntu-latest
    name: pip-audit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      # Resolves requirements.txt in an isolated environment and fails on any
      # dependency with a published advisory, so new advisories (like the
      # Pillow batch fixed in 13.0.0) fail CI instead of waiting on a manual
      # check. Can go red with no code change when a new advisory lands.
      - run: pip-audit -r requirements.txt --strict
